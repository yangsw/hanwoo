<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>혈통</title>
  <link rel="stylesheet" href="../css/hanwoo.css">
</head>
<body>
  <header class="app" data-app-header></header>
  <main class="wrap">
    <h1>혈통</h1>
    <div id="ped"></div>
  </main>
  <script src="../js/app.js"></script>
  <script>
    (async function () {
      const id = new URLSearchParams(location.search).get("id") || "002-123456789";
      const tree = await HANWOO.loadJSON("pedigree.json");
      const p = tree[id] || tree[Object.keys(tree)[0]];
      document.getElementById("ped").innerHTML =
        '<div class="card"><h2>' + id + '</h2><p>아버지 ' + p.sire + ' · 어미 ' + p.dam +
        '</p><p>조부 → 조부아버지 ' + p.sire_sire + ' / 조부어미 ' + p.sire_dam +
        '</p><p>외조모 → 외조부아버지 ' + p.dam_sire + ' / 외조모어미 ' + p.dam_dam + '</p></div>';
    })();
  </script>
</body>
</html>
